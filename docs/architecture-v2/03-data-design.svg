>earthaccess · httpx</text><text x="570.0" y="451" fill="#ffffff" font-size="17" font-weight="400" text-anchor="middle">Retrieve selected products;</text><text x="570.0" y="475" fill="#ffffff" font-size="17" font-weight="400" text-anchor="middle">record source dates and units</text></g><g class="arch-node" data-node="raw" role="button" tabindex="0" aria-label="Raw product store. Planned data store. Show details."><title>Raw product store — Planned data store: Keep original measurements and retrieval metadata</title><rect class="node-shape" x="415" y="710" width="310" height="220" rx="4" fill="#a56e22" stroke="#a56e22" stroke-width="2" stroke-dasharray="5 4"/><g transform="translate(555.0 726) scale(1.25)" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z M8 8l3 3-3 3m5 0h4"/></g><text x="570.0" y="780" fill="#ffffff" font-size="22" font-weight="650" text-anchor="middle">Raw product store</text><text x="570.0" y="806" fill="#ffffff" font-size="13.5" font-weight="400" text-anchor="middle">[Planned data store]</text><text x="570.0" y="832" fill="#ffffff" font-size="15" font-weight="500" text-anchor="middle">NetCDF / HDF5, as required</text><text x="570.0" y="861" fill="#ffffff" font-size="17" font-weight="400" text-anchor="middle">Keep original measurements</text><text x="570.0" y="885" fill="#ffffff" font-size="17" font-weight="400" text-anchor="middle">and retrieval metadata</text></g><g class="arch-node" data-node="prepare" role="button" tabindex="0" aria-label="Data preparation. Planned process. Show details."><title>Data preparation — Planned process: Align state and date; check gaps, units, coverage and risk rules</title><rect class="node-shape" x="960" y="300" width="320" height="220" rx="4" fill="#a56e22" stroke="#a56e22" stroke-width="2" stroke-dasharray="5 4"/><g transform="translate(1105.0 316) scale(1.25)" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z M8 8l3 3-3 3m5 0h4"/></g><text x="1120.0" y="370" fill="#ffffff" font-size="22" font-weight="650" text-anchor="middle">Data preparation</text><text x="1120.0" y="396" fill="#ffffff" font-size="13.5" font-weight="400" text-anchor="middle">[Planned process]</text><text x="1120.0" y="422" fill="#ffffff" font-size="15" font-weight="500" text-anchor="middle">pandas · xarray · geospatial tools</text><text x="1120.0" y="451" fill="#ffffff" font-size="17" font-weight="400" text-anchor="middle">Align state and date; check gaps,</text><text x="1120.0" y="475" fill="#ffffff" font-size="17" font-weight="400" text-anchor="middle">units, coverage and risk rules</text></g><g class="arch-node" data-node="ready" role="button" tabindex="0" aria-label="Prepared data store. Data store / planned writer. Show details."><title>Prepared data store — Data store / planned writer: Weather, risk, map categories and daily history for the app</title><rect class="node-shape" x="960" y="710" width="320" height="220" rx="4" fill="#16766f" stroke="#16766f" stroke-width="2"/><g transform="translate(1105.0 726) scale(1.25)" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6h8l2 3h10v12H2z M2 10h20"/></g><text x="1120.0" y="780" fill="#ffffff" font-size="22" font-weight="650" text-anchor="middle">Prepared data store</text><text x="1120.0" y="806" fill="#ffffff" font-size="13.5" font-weight="400" text-anchor="middle">[Data store / planned writer]</text><text x="1120.0" y="832" fill="#ffffff" font-size="15" font-weight="500" text-anchor="middle">CSV + GeoJSON interface</text><text x="1120.0" y="861" fill="#ffffff" font-size="17" font-weight="400" text-anchor="middle">Weather, risk, map categories</text><text x="1120.0" y="885" fill="#ffffff" font-size="17" font-weight="400" text-anchor="middle">and daily history for the app</text></g><g class="arch-node" data-node="server" role="button" tabindex="0" aria-label="Web application. Current server container. Show details."><title>Web application — Current server container: Read prepared records; render cards, maps and chart data</title><rect class="node-shape" x="1420" y="300" width="300" height="220" rx="4" fill="#1d6196" stroke="#1d6196" stroke-width="2"/><g transform="translate(1555.0 316) scale(1.25)" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h18v7H3z M3 14h18v7H3z M6 6h1m3 0h7 M6 17h1m3 0h7"/></g><text x="1570.0" y="370" fill="#ffffff" font-size="22" font-weight="650" text-anchor="middle">Web application</text><text x="1570.0" y="396" fill="#ffffff" font-size="13.5" font-weight="400" text-anchor="middle">[Current server container]</text><text x="1570.0" y="422" fill="#ffffff" font-size="15" font-weight="500" text-anchor="middle">FastAPI · Jinja2 · pandas</text><text x="1570.0" y="451" fill="#ffffff" font-size="17" font-weight="400" text-anchor="middle">Read prepared records; render</text><text x="1570.0" y="475" fill="#ffffff" font-size="17" font-weight="400" text-anchor="middle">cards, maps and chart data</text></g><g class="arch-node" data-node="browser" role="button" tabindex="0" aria-label="Dashboard UI. Current client container. Show details."><title>Dashboard UI — Current client container: Show selected conditions, maps and historical trends</title><rect class="node-shape" x="1420" y="710" width="300" height="220" rx="4" fill="#70549c" stroke="#70549c" stroke-width="2"/><g transform="translate(1555.0 726) scale(1.25)" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h18v18H3z M3 8h18 M6 5.5h1m3 0h1 M7 12h4v5H7z M14 12h4m-4 4h4"/></g><text x="1570.0" y="780" fill="#ffffff" font-size="22" font-weight="650" text-anchor="middle">Dashboard UI</text><text x="1570.0" y="806" fill="#ffffff" font-size="13.5" font-weight="400" text-anchor="middle">[Current client container]</text><text x="1570.0" y="832" fill="#ffffff" font-size="15" font-weight="500" text-anchor="middle">HTML · JS · Leaflet · Plotly.js</text><text x="1570.0" y="861" fill="#ffffff" font-size="17" font-weight="400" text-anchor="middle">Show selected conditions,</text><text x="1570.0" y="885" fill="#ffffff" font-size="17" font-weight="400" text-anchor="middle">maps and historical trends</text></g><g class="arch-node" data-node="ml" role="button" tabindex="0" aria-label="Forecasting model. Optional planned process. Show details."><title>Forecasting model — Optional planned process: Evaluate forecasts before connecting them to the app</title><rect class="node-shape" x="415" y="1085" width="310" height="175" rx="4" fill="#a56e22" stroke="#a56e22" stroke-width="2" stroke-dasharray="5 4"/><g transform="translate(555.0 1101) scale(1.25)" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z M8 8l3 3-3 3m5 0h4"/></g><text x="570.0" y="1145" fill="#ffffff" font-size="22" font-weight="650" text-anchor="middle">Forecasting model</text><text x="570.0" y="1167" fill="#ffffff" font-size="13.5" font-weight="400" text-anchor="middle">[Optional planned process]</text><text x="570.0" y="1191" fill="#ffffff" font-size="15" font-weight="500" text-anchor="middle">Prophet · scikit-learn</text><text x="570.0" y="1217" fill="#ffffff" font-size="17" font-weight="400" text-anchor="middle">Evaluate forecasts before</text><text x="570.0" y="1241" fill="#ffffff" font-size="17" font-weight="400" text-anchor="middle">connecting them to the app</text></g><text x="40" y="1035" fill="#465e72" font-size="17" font-weight="400" text-anchor="start">The current dashboard uses supplied local files. Automatic NASA ingestion, preparation and forecasting are proposed here.</text><text x="780" y="1235" fill="#465e72" font-size="17" font-weight="400" text-anchor="start">The model has no current serving connection. The existing Simulation panel displays earlier stored conditions.</text><path d="M45 1273H1755" fill="none" stroke="#dbe3eb"/><rect x="45" y="1296" width="16" height="16" fill="#25394c"/><text x="70" y="1310" fill="#465e72" font-size="14" font-weight="400" text-anchor="start">Person</text><rect x="240" y="1296" width="16" height="16" fill="#70549c"/><text x="265" y="1310" fill="#465e72" font-size="14" font-weight="400" text-anchor="start">Browser UI</text><rect x="470" y="1296" width="16" height="16" fill="#1d6196"/><text x="495" y="1310" fill="#465e72" font-size="14" font-weight="400" text-anchor="start">Server / component</text><rect x="690" y="1296" width="16" height="16" fill="#16766f"/><text x="715" y="1310" fill="#465e72" font-size="14" font-weight="400" text-anchor="start">File data store</text><rect x="900" y="1296" width="16" height="16" fill="#687583"/><text x="925" y="1310" fill="#465e72" font-size="14" font-weight="400" text-anchor="start">External system</text><rect x="1160" y="1296" width="16" height="16" fill="#a56e22"/><text x="1185" y="1310" fill="#465e72" font-size="14" font-weight="400" text-anchor="start">Planned process</text><text x="1755" y="1310" fill="#465e72" font-size="14" font-weight="400" text-anchor="end">→ Label = action + protocol</text><text x="45" y="1345" fill="#657789" font-size="13" font-weight="400" text-anchor="start">Notation: C4-informed views · dashed outer line = scope boundary · amber dashed arrow = proposed integration</text></svg>