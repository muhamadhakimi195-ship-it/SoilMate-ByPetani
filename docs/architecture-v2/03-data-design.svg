<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1360" viewBox="0 0 1800 1360" role="img" aria-labelledby="title-03-data-design desc-03-data-design"><title id="title-03-data-design">Data architecture — NASA to dashboard</title><desc id="desc-03-data-design">Proposed integration design | Amber = planned pipeline | Blue / purple = current runtime | Green = existing file interface. Every directional relationship states what it carries or calls. Click nodes in the interactive explorer for details.</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#526579"/></marker><marker id="arr-plan" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a56e22"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif}.arch-node{cursor:pointer;outline:none}.arch-node:focus .node-shape,.arch-node:hover .node-shape{stroke:#12273a;stroke-width:4}.arch-node.selected .node-shape{stroke:#e29a30;stroke-width:5}.muted{opacity:.16}</style><rect x="0" y="0" width="1800" height="1360" fill="#ffffff"/><text x="45" y="68" fill="#20354a" font-size="36" font-weight="650" text-anchor="start">Data architecture — NASA to dashboard</text><text x="47" y="108" fill="#586a7c" font-size="17" font-weight="400" text-anchor="start">Proposed integration design | Amber = planned pipeline | Blue / purple = current runtime | Green = existing file interface</text><rect x="365" y="185" width="975" height="810" rx="4" fill="#fffaf0" stroke="#b38c48" stroke-width="1.7" stroke-dasharray="9 6"/><text x="383" y="216" fill="#20354a" font-size="20" font-weight="650" text-anchor="start">Data preparation</text><text x="383" y="242" fill="#586a7c" font-size="14" font-weight="400" text-anchor="start">Proposed offline / batch pipeline</text><rect x="1390" y="185" width="360" height="810" rx="4" fill="#f8fafc" stroke="#91a2b3" stroke-width="1.7" stroke-dasharray="9 6"/><text x="1408" y="216" fill="#20354a" font-size="20" font-weight="650" text-anchor="start">Serving layer</text><text x="1408" y="242" fill="#586a7c" font-size="14" font-weight="400" text-anchor="start">Current runtime</text><g class="relationship" data-from="nasa" data-to="import"><path d="M300 450 L415 450" fill="none" stroke="#a56e22" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arr-plan)"/><rect x="318.95" y="367" width="76.10000000000001" height="55" fill="#ffffff"/><text x="357" y="385" fill="#a56e22" font-size="15.5" font-weight="400" text-anchor="middle">Fetch</text><text x="357" y="408" fill="#a56e22" font-size="15.5" font-weight="400" text-anchor="middle">[HTTPS]</text></g><g class="relationship" data-from="import" data-to="raw"><path d="M570 520 L570 710" fill="none" stroke="#a56e22" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arr-plan)"/><rect x="618.75" y="602" width="142.5" height="55" fill="#ffffff"/><text x="690" y="620" fill="#a56e22" font-size="15.5" font-weight="400" text-anchor="middle">Store raw files</text><text x="690" y="643" fill="#a56e22" font-size="15.5" font-weight="400" text-anchor="middle">[File write]</text></g><g class="relationship" data-from="raw" data-to="prepare"><path d="M725 820 L840 820 L840 410 L960 410" fill="none" stroke="#a56e22" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arr-plan)"/><rect x="763.45" y="542" width="159.10000000000002" height="55" fill="#ffffff"/><text x="843" y="560" fill="#a56e22" font-size="15.5" font-weight="400" text-anchor="middle">Load measurements</text><text x="843" y="583" fill="#a56e22" font-size="15.5" font-weight="400" text-anchor="middle">[File read]</text></g><g class="relationship" data-from="prepare" data-to="ready"><path d="M1120 520 L1120 710" fill="none" stroke="#a56e22" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arr-plan)"/><rect x="1019.7" y="600" width="200.60000000000002" height="55" fill="#ffffff"/><text x="1120" y="618" fill="#a56e22" font-size="15.5" font-weight="400" text-anchor="middle">Publish checked tables</text><text x="1120" y="641" fill="#a56e22" font-size="15.5" font-weight="400" text-anchor="middle">[File write]</text></g><g class="relationship" data-from="ready" data-to="server"><path d="M1280 820 L1365 820 L1365 410 L1420 410" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arr)"/><rect x="1273.0" y="592" width="184.0" height="55" fill="#ffffff"/><text x="1365" y="610" fill="#526579" font-size="15.5" font-weight="400" text-anchor="middle">Supplies app records</text><text x="1365" y="633" fill="#526579" font-size="15.5" font-weight="400" text-anchor="middle">[Local file read]</text></g><g class="relationship" data-from="server" data-to="browser"><path d="M1570 520 L1570 710" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arr)"/><rect x="1465.55" y="597" width="208.9" height="55" fill="#ffffff"/><text x="1570" y="615" fill="#526579" font-size="15.5" font-weight="400" text-anchor="middle">Serve pages and results</text><text x="1570" y="638" fill="#526579" font-size="15.5" font-weight="400" text-anchor="middle">[HTTP response]</text></g><g class="relationship" data-from="ready" data-to="ml"><path d="M1120 930 L1120 1170 L725 1170" fill="none" stroke="#a56e22" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arr-plan)"/><rect x="838.25" y="1104" width="225.50000000000003" height="55" fill="#ffffff"/><text x="951" y="1122" fill="#a56e22" font-size="15.5" font-weight="400" text-anchor="middle">Provide historical series</text><text x="951" y="1145" fill="#a56e22" font-size="15.5" font-weight="400" text-anchor="middle">[Future file interface]</text></g><g class="arch-node" data-node="nasa" role="button" tabindex="0" aria-label="NASA data products. External systems. Show details."><title>NASA data products — External systems: POWER: weather GPM IMERG: rain SMAP L4: soil ECOSTRESS ESI: plant stress</title><rect class="node-shape" x="40" y="400" width="260" height="310" rx="4"