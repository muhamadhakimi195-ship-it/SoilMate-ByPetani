<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title-01-system desc-01-system"><title id="title-01-system">System architecture — SoilMate</title><desc id="desc-01-system">C4 container view | Current implementation | Nasa Petani | 15 Nov 2026. Every directional relationship states what it carries or calls. Click nodes in the interactive explorer for details.</desc><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#526579"/></marker><marker id="arr-plan" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a56e22"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif}.arch-node{cursor:pointer;outline:none}.arch-node:focus .node-shape,.arch-node:hover .node-shape{stroke:#12273a;stroke-width:4}.arch-node.selected .node-shape{stroke:#e29a30;stroke-width:5}.muted{opacity:.16}</style><rect x="0" y="0" width="1800" height="1120" fill="#ffffff"/><text x="45" y="68" fill="#20354a" font-size="36" font-weight="650" text-anchor="start">System architecture — SoilMate</text><text x="47" y="108" fill="#586a7c" font-size="17" font-weight="400" text-anchor="start">C4 container view | Current implementation | Nasa Petani | 15 Nov 2026</text><rect x="320" y="390" width="1425" height="505" rx="4" fill="#f8fafc" stroke="#91a2b3" stroke-width="1.7" stroke-dasharray="9 6"/><text x="338" y="421" fill="#20354a" font-size="20" font-weight="650" text-anchor="start">SoilMate</text><text x="338" y="447" fill="#586a7c" font-size="14" font-weight="400" text-anchor="start">Software system boundary</text><g class="relationship" data-from="grower" data-to="ui"><path d="M260 680 L380 680" fill="none" stroke="#526579" stroke-width="2" marker-end="url(#arr)"/><rect x="261.2" y="619" width="117.60000000000001" height="55" fill="#ffffff"/><text x="320" y="637" fill="#526579" font-size="15.5" font-weight="400" tex