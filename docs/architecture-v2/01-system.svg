"middle">HTML · CSS · JavaScript</text><text x="540.0" y="711" fill="#ffffff" font-size="17" font-weight="400" text-anchor="middle">Overview, maps and trends</text><text x="540.0" y="735" fill="#ffffff" font-size="17" font-weight="400" text-anchor="middle">Plotly.js · Leaflet · Bootstrap</text></g><g class="arch-node" data-node="web" role="button" tabindex="0" aria-label="Web application. Server container. Show details."><title>Web application — Server container: Reads selected data and renders pages, maps and charts</title><rect class="node-shape" x="900" y="560" width="320" height="240" rx="4" fill="#1d6196" stroke="#1d6196" stroke-width="2"/><g transform="translate(1045.0 576) scale(1.25)" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h18v7H3z M3 14h18v7H3z M6 6h1m3 0h7 M6 17h1m3 0h7"/></g><text x="1060.0" y="630" fill="#ffffff" font-size="22" font-weight="650" text-anchor="middle">Web application</text><text x="1060.0" y="656" fill="#ffffff" font-size="13.5" font-weight="400" text-anchor="middle">[Server container]</text><text x="1060.0" y="682" fill="#ffffff" font-size="15" font-weight="500" text-anchor="middle">Python · FastAPI · Jinja2</text><text x="1060.0" y="711" fill="#ffffff" font-size="17" font-weight="400" text-anchor="middle">Reads selected data and</text><text x="1060.0" y="735" fill="#ffffff" font-size="17" font-weight="400" text-anchor="middle">renders pages, maps and charts</text></g><g class="arch-node" data-node="files" role="button" tabindex="0" aria-label="Project data. Data store. Show details."><title>Project data — Data store: Weather, risk and daily history Malaysia state boundaries</title><rect class="node-shape" x="1400" y="560" width="285" height="240" rx="4" fill="#16766f" stroke="#16766f" stroke-width="2"/><g transform="translate(1527.5 576) scale(1.25)" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6h8l2 3h10v12H